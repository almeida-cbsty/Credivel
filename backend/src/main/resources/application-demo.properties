# Perfil temporário autónomo. Produção MySQL continua configurada em application.properties.
spring.datasource.url=jdbc:h2:file:/opt/credivel/data/credivel;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
credivel.cors.allowed-origins=http://127.0.0.1:8084,http://localhost:8084
