server.port=${SERVER_PORT:8083}
spring.application.name=credivel-api
spring.datasource.url=${CREDIVEL_DB_URL:jdbc:mysql://127.0.0.1:3306/credivel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CREDIVEL_DB_USERNAME:credivel}
spring.datasource.password=${CREDIVEL_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
credivel.cors.allowed-origins=${CREDIVEL_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
